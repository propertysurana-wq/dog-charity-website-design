        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Hind:wght@400;500;600&display=swap');
        :root { --Y:#ffd100; --N:#002b5c; --NL:#003d85; --YD:#e6bc00; }
        *,*::before,*::after{box-sizing:border-box;}
        .gi{font-family:'Hind',sans-serif;min-height:100vh;color:#333;}
        .gi h1,.gi h2,.gi h3,.gi h4{font-family:'Baloo 2',cursive;}
        .gi-w{max-width:1200px;margin:0 auto;padding:0 20px;}

        /* HERO */
        .gi-hero{background:var(--N);color:white;padding:90px 0 120px;position:relative;overflow:hidden;}
        .gi-hero::before{content:'';position:absolute;top:-100px;right:-100px;width:450px;height:450px;background:var(--Y);border-radius:50%;opacity:.07;}
        .gi-hero::after{content:'';position:absolute;bottom:-80px;left:-60px;width:300px;height:300px;background:var(--Y);border-radius:50%;opacity:.05;}
        .gi-hero-in{position:relative;z-index:1;max-width:680px;}
        .gi-tag{display:inline-block;background:var(--Y);color:var(--N);font-family:'Baloo 2',cursive;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:5px 16px;border-radius:4px;margin-bottom:16px;}
        .gi-hero h1{font-size:clamp(2.2rem,5vw,3.8rem);font-weight:800;line-height:1.1;margin-bottom:20px;}
        .gi-hero h1 span{color:var(--Y);}
        .gi-hero p{font-size:1.05rem;color:rgba(255,255,255,.8);line-height:1.7;}

        /* QUICK */
        .gi-quick{background:#f8f9ff;padding:0 0 56px;}
        .gi-qg{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:-60px;}
        @media(min-width:768px){.gi-qg{grid-template-columns:repeat(4,1fr);}}
        .gi-qc{background:white;border-radius:16px;padding:24px 16px;text-align:center;box-shadow:0 8px 30px rgba(0,43,92,.1);text-decoration:none;transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,border-color .3s;border-bottom:4px solid transparent;display:block;}
        .gi-qc:hover{transform:translateY(-8px);box-shadow:0 20px 50px rgba(0,43,92,.18);border-bottom-color:var(--Y);}
        .gi-qi{width:54px;height:54px;border-radius:50%;object-fit:cover;margin:0 auto 10px;border:3px solid var(--Y);display:block;transition:transform .3s;}
        .gi-qc:hover .gi-qi{transform:scale(1.1) rotate(-5deg);}
        .gi-qc h3{font-weight:700;color:var(--N);font-size:.95rem;}

        /* LABELS */
        .gi-lbl{display:inline-block;background:var(--Y);color:var(--N);font-family:'Baloo 2',cursive;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:4px 14px;border-radius:4px;margin-bottom:12px;}
        .gi-ttl{font-size:clamp(1.8rem,3.5vw,2.6rem);font-weight:800;color:var(--N);margin-bottom:12px;}
        .gi-desc{color:#666;font-size:1rem;line-height:1.7;}

        /* BTNS */
        .gi-bp{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;background:var(--N);color:white;font-family:'Baloo 2',cursive;font-weight:700;font-size:.95rem;border-radius:50px;text-decoration:none;border:none;cursor:pointer;transition:background .25s,transform .3s;}
        .gi-bp:hover{background:var(--NL);transform:translateY(-3px);}
        .gi-bo{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;background:transparent;color:var(--N);font-family:'Baloo 2',cursive;font-weight:700;font-size:.95rem;border-radius:50px;text-decoration:none;border:2px solid var(--N);cursor:pointer;transition:background .25s,color .25s,transform .3s;}
        .gi-bo:hover{background:var(--N);color:white;transform:translateY(-3px);}
        .gi-by{display:inline-flex;align-items:center;gap:8px;padding:14px 30px;background:var(--Y);color:var(--N);font-family:'Baloo 2',cursive;font-weight:700;font-size:1rem;border-radius:50px;text-decoration:none;transition:background .25s,transform .3s;}
        .gi-by:hover{background:var(--YD);transform:translateY(-3px);}
        .gi-bwo{display:inline-flex;align-items:center;gap:8px;padding:14px 30px;background:transparent;color:white;font-family:'Baloo 2',cursive;font-weight:700;font-size:1rem;border-radius:50px;text-decoration:none;border:2px solid white;transition:background .25s,color .25s,transform .3s;}
        .gi-bwo:hover{background:white;color:var(--N);transform:translateY(-3px);}

        /* VOL */
        .gi-vol{padding:80px 0;background:white;}
        .gi-vtop{display:grid;gap:40px;align-items:center;margin-bottom:52px;}
        @media(min-width:1024px){.gi-vtop{grid-template-columns:1fr 1fr;}}
        .gi-vtop p{color:#555;line-height:1.7;margin-bottom:24px;}
        .gi-vbtns{display:flex;flex-wrap:wrap;gap:14px;}
        .gi-vimg{width:100%;height:380px;object-fit:cover;border-radius:20px;box-shadow:0 20px 60px rgba(0,43,92,.15);transition:transform .4s;}
        .gi-vimg:hover{transform:scale(1.02);}
        .gi-rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;}
        .gi-rc{background:#f8f9ff;border-radius:16px;overflow:hidden;border:2px solid transparent;transition:transform .35s cubic-bezier(.34,1.56,.64,1),border-color .3s,box-shadow .3s;cursor:pointer;}
        .gi-rc:hover{transform:translateY(-8px);border-color:var(--Y);box-shadow:0 16px 40px rgba(0,43,92,.12);}
        .gi-riw{overflow:hidden;height:160px;position:relative;}
        .gi-ri{width:100%;height:100%;object-fit:cover;transition:transform .5s;}
        .gi-rc:hover .gi-ri{transform:scale(1.08);}
        .gi-rov{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,43,92,.5));opacity:0;transition:opacity .3s;}
        .gi-rc:hover .gi-rov{opacity:1;}
        .gi-rb{padding:18px;}
        .gi-rb h3{font-weight:700;color:var(--N);font-size:1.05rem;margin-bottom:6px;}
        .gi-rb p{color:#666;font-size:.85rem;line-height:1.5;margin-bottom:10px;}
        .gi-badge{display:inline-flex;align-items:center;gap:5px;background:var(--Y);color:var(--N);font-family:'Baloo 2',cursive;font-size:.78rem;font-weight:700;padding:3px 12px;border-radius:50px;}

        /* FUND */
        .gi-fund{padding:80px 0;background:#f8f9ff;}
        .gi-fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin:48px 0 36px;}
        .gi-fc{background:white;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(0,43,92,.08);transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,border-color .3s;border-bottom:4px solid transparent;cursor:pointer;}
        .gi-fc:hover{transform:translateY(-10px) scale(1.02);box-shadow:0 22px 50px rgba(0,43,92,.15);border-bottom-color:var(--Y);}
        .gi-fiw{overflow:hidden;height:140px;position:relative;}
        .gi-fimg{width:100%;height:100%;object-fit:cover;transition:transform .5s;}
        .gi-fc:hover .gi-fimg{transform:scale(1.1);}
        .gi-fem{position:absolute;top:10px;right:10px;font-size:1.8rem;background:var(--Y);padding:4px 10px;border-radius:10px;}
        .gi-fb{padding:18px;text-align:center;}
        .gi-fb h3{font-weight:700;color:var(--N);font-size:1rem;margin-bottom:4px;}
        .gi-fb p{color:#666;font-size:.85rem;line-height:1.5;}

        /* CORP */
        .gi-corp{padding:80px 0;background:white;}
        .gi-cg{display:grid;gap:48px;align-items:center;}
        @media(min-width:1024px){.gi-cg{grid-template-columns:1fr 1fr;}}
        .gi-cimg{width:100%;height:380px;object-fit:cover;border-radius:20px;box-shadow:0 20px 60px rgba(0,43,92,.15);transition:transform .4s;}
        .gi-cimg:hover{transform:scale(1.02);}
        .gi-cl{list-style:none;padding:0;margin:20px 0 28px;}
        .gi-cl li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f0f0f0;color:#555;font-size:.92rem;transition:padding-left .25s,color .25s;cursor:pointer;}
        .gi-cl li:hover{padding-left:8px;color:var(--N);}
        .gi-ck{width:26px;height:26px;min-width:26px;background:var(--Y);color:var(--N);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;}

        /* LEGACY */
        .gi-leg{padding:80px 0;background:var(--N);color:white;text-align:center;}
        .gi-legi{width:80px;height:80px;border-radius:50%;object-fit:cover;border:4px solid var(--Y);margin:0 auto 24px;display:block;animation:gipls 2.5s infinite;}
        @keyframes gipls{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,209,0,.4)}50%{transform:scale(1.06);box-shadow:0 0 0 14px rgba(255,209,0,0)}}
        .gi-leg h2{font-size:clamp(1.8rem,3.5vw,2.6rem);font-weight:800;margin-bottom:16px;}
        .gi-leg p{color:rgba(255,255,255,.75);font-size:1rem;max-width:560px;margin:0 auto 32px;line-height:1.7;}

        .gi-fsec::before{content:'';position:absolute;top:-80px;right:-80px;width:380px;height:380px;background:var(--Y);border-radius:50%;opacity:.07;}
        .gi-fsec::after{content:'';position:absolute;bottom:-80px;left:-80px;width:280px;height:280px;background:var(--Y);border-radius:50%;opacity:.05;}
        .gi-fcard{max-width:820px;margin:0 auto;background:white;border-radius:28px;padding:52px 44px;box-shadow:0 40px 100px rgba(0,0,0,.28);position:relative;z-index:1;}
        @media(max-width:600px){.gi-fcard{padding:32px 18px;}}

        .gi-fhdr{text-align:center;margin-bottom:36px;}
        .gi-fhdr-img{width:74px;height:74px;border-radius:50%;object-fit:cover;border:4px solid var(--Y);margin:0 auto 16px;display:block;}
        .gi-fhdr h2{font-size:1.9rem;font-weight:800;color:var(--N);margin-bottom:8px;}
        .gi-fhdr p{color:#666;font-size:.93rem;line-height:1.6;max-width:500px;margin:0 auto;}

        .gi-divider{display:flex;align-items:center;gap:12px;margin:28px 0 20px;}

        .gi-divider-t{font-family:'Baloo 2',cursive;font-weight:700;color:var(--N);font-size:.8rem;letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap;}

        .gi-fgrid{display:flex;flex-direction:column;gap:20px;}

        .gi-sub{width:100%;padding:17px;background:var(--N);color:white;font-family:'Baloo 2',cursive;font-size:1.1rem;font-weight:700;border:none;border-radius:14px;cursor:pointer;transition:background .25s,transform .3s,box-shadow .3s;display:flex;align-items:center;justify-content:center;gap:12px;margin-top:4px;}

        .gi-sub img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--Y);}

  .service-card:hover .svc-img {
    transform: scale(1.15) rotate(-3deg);
  }

  .step-circle {
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), background 0.3s ease;
  }
  .step-item:hover .step-circle {
    transform: scale(1.15);
    background: #fff;
    color: #002B5C;
  }
  .step-item:hover h3 { color: #FFD100; }

  .stat-card {
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .stat-card:hover {
    transform: translateY(-4px) scale(1.04);
    box-shadow: 0 8px 24px rgba(0,43,92,0.12);
  }

  .cta-btn {
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .cta-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fadeUp 0.7s ease both; }
  .delay-1 { animation-delay: 0.1s; }
  .delay-2 { animation-delay: 0.2s; }
  .delay-3 { animation-delay: 0.3s; }

  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap');

  .ourwork-root * { font-family: 'Nunito', sans-serif; }
  .ourwork-root h1,
  .ourwork-root h2,
  .ourwork-root h3 { font-family: 'Playfair Display', serif; }

  /* Work area cards */
  .work-card {
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1), box-shadow 0.35s ease;
  }
  .work-card:hover {
    transform: translateY(-8px) scale(1.01);
    box-shadow: 0 28px 56px rgba(0,43,92,0.16);
  }
  .work-card .card-side-img {
    transition: transform 0.5s ease;
    overflow: hidden;
  }
  .work-card:hover .card-side-img img {
    transform: scale(1.1);
  }
  .work-card .card-side-img img {
    transition: transform 0.5s ease;
  }
  .learn-btn {
    transition: background 0.25s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }
  .learn-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,43,92,0.25);
    background: #FFD100;
    color: #002B5C;
  }

  /* Stat cards */
  .stat-card {
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), box-shadow 0.3s ease;
  }
  .stat-card:hover {
    transform: translateY(-6px) scale(1.05);
    box-shadow: 0 12px 30px rgba(0,43,92,0.15);
  }
  .stat-card .stat-img {
    transition: transform 0.4s ease;
  }
  .stat-card:hover .stat-img {
    transform: scale(1.12) rotate(-3deg);
  }

  /* Approach section */
  .approach-item {
    transition: background 0.2s ease, transform 0.2s ease;
    border-radius: 8px;
    padding: 6px 8px;
  }
  .approach-item:hover {
    background: #fffbea;
    transform: translateX(4px);
  }
  .approach-item-red:hover {
    background: #fff1f1;
    transform: translateX(4px);
  }

  /* Emergency section */
  .emergency-btn {
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .emergency-btn:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 10px 24px rgba(0,0,0,0.2);
  }

  /* CTA buttons */
  .cta-link {
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  .cta-link:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  }

  /* Fade-up animation */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fadeUp 0.7s ease both; }
  .d1 { animation-delay: 0.1s; }
  .d2 { animation-delay: 0.2s; }
  .d3 { animation-delay: 0.3s; }

  /* Phone pulse */
  @keyframes pulse-ring {
    0%   { box-shadow: 0 0 0 0 rgba(255,255,255,0.5); }
    70%  { box-shadow: 0 0 0 16px rgba(255,255,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
  }
  .pulse-btn { animation: pulse-ring 2s infinite; }

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap');

        /* ── Reveal ── */
        .rev      { opacity:0; transform:translateY(36px); transition:opacity 0.85s cubic-bezier(0.16,1,0.3,1), transform 0.85s cubic-bezier(0.16,1,0.3,1); }
        .rev.in   { opacity:1; transform:translateY(0); }
        .rev-l    { opacity:0; transform:translateX(-44px); transition:opacity 0.85s ease, transform 0.85s ease; }
        .rev-l.in { opacity:1; transform:translateX(0); }
        .rev-r    { opacity:0; transform:translateX(44px);  transition:opacity 0.85s ease, transform 0.85s ease; }
        .rev-r.in { opacity:1; transform:translateX(0); }

        /* stagger */
        .stag > * { opacity:0; transform:translateY(20px); transition:opacity 0.55s ease, transform 0.55s ease; }
        .stag.in > *:nth-child(1){opacity:1;transform:none;transition-delay:0ms}
        .stag.in > *:nth-child(2){opacity:1;transform:none;transition-delay:80ms}
        .stag.in > *:nth-child(3){opacity:1;transform:none;transition-delay:160ms}
        .stag.in > *:nth-child(4){opacity:1;transform:none;transition-delay:240ms}
        .stag.in > *:nth-child(5){opacity:1;transform:none;transition-delay:320ms}
        .stag.in > *:nth-child(6){opacity:1;transform:none;transition-delay:400ms}

        /* ── Hero paws ── */
        @keyframes floatpaw { 0%,100%{transform:translateY(0) rotate(-8deg)} 50%{transform:translateY(-16px) rotate(8deg)} }
        .paw-float { animation:floatpaw 5s ease-in-out infinite; }

        /* ── Problem cards ── */
        .problem-card { transition:transform 0.45s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.45s ease, border-color 0.3s ease; }
        .problem-card:hover { transform:translateY(-10px); box-shadow:0 28px 56px rgba(0,43,92,0.13); border-color:#ffd100; }
        .problem-card:hover .prob-img { transform:scale(1.08); }
        .pc-bar { position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,#ffd100,#f97316); transform:scaleX(0); transform-origin:left; transition:transform 0.5s ease; border-radius:3px 3px 0 0; }
        .problem-card:hover .pc-bar { transform:scaleX(1); }

        /* ── Process cards ── */
        .process-card { transition:transform 0.45s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.45s ease, border-color 0.3s ease; }
        .process-card:hover { transform:translateY(-10px); box-shadow:0 28px 56px rgba(0,43,92,0.14); border-color:#ffd100; }
        .process-card:hover .proc-img { transform:scale(1.08); }

        /* ── Approach check rows ── */
        .check-row { display:flex; align-items:flex-start; gap:14px; padding:14px 16px; border-radius:16px; transition:background 0.3s ease, transform 0.3s ease; cursor:default; }
        .check-row:hover { background:rgba(0,43,92,0.04); transform:translateX(6px); }

        /* ── Do-not cards ── */
        .dont-row { display:flex; align-items:flex-start; gap:14px; padding:14px 16px; border-radius:16px; transition:background 0.3s ease, transform 0.3s ease; cursor:default; }
        .dont-row:hover { background:#fef2f2; transform:translateX(4px); }

        /* ── Tip cards ── */
        .tip-card { transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.4s ease, border-color 0.3s ease; }
        .tip-card:hover { transform:translateY(-8px); box-shadow:0 24px 50px rgba(0,43,92,0.12); border-color:#ffd100; }

        /* ── Tip image header ── */
        .tip-img-wrap { overflow:hidden; border-radius:20px 20px 0 0; }
        .tip-img { transition:transform 0.6s ease; }
        .tip-card:hover .tip-img { transform:scale(1.06); }

        /* ── Approach image ── */
        .approach-img-wrap { transition:transform 0.5s ease, box-shadow 0.5s ease; }
        .approach-img-wrap:hover { transform:translateY(-6px) rotate(-1deg); box-shadow:0 30px 65px rgba(0,43,92,0.18); }

        /* ── CTA buttons ── */
        .btn-gold { position:relative; overflow:hidden; background:#ffd100; color:#002b5c; transition:transform 0.25s ease, box-shadow 0.25s ease; }
        .btn-gold::after { content:''; position:absolute; inset:0; background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,0.25) 50%,transparent 60%); background-size:200% 100%; background-position:200% 0; transition:background-position 0.5s ease; }
        .btn-gold:hover { transform:translateY(-3px); box-shadow:0 14px 36px rgba(255,209,0,0.4); }
        .btn-gold:hover::after { background-position:-200% 0; }
        .btn-outline-w { transition:all 0.3s ease; }
        .btn-outline-w:hover { background:rgba(255,255,255,0.15); transform:translateY(-3px); }

        /* ── Key message bar ── */
        .key-msg { transition:transform 0.3s ease; }
        .key-msg:hover { transform:scale(1.01); }

        /* ── dot bg ── */

        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Hind:wght@400;500;600&display=swap');

        :root {
          --yellow: #ffd100;
          --navy: #002b5c;
          --navy-light: #003d85;
          --yellow-dark: #e6bc00;
        }

        * { box-sizing: border-box; }

        .aachi-page {
          font-family: 'Hind', sans-serif;
          min-height: 100vh;
          color: #333;
        }

        .aachi-page h1, .aachi-page h2, .aachi-page h3, .aachi-page h4 {
          font-family: 'Baloo 2', cursive;
        }

        /* Hero */
        .hero-section {
          background: var(--navy);
          color: white;
          padding: 80px 0 60px;
          position: relative;
          overflow: hidden;
        }

        .hero-section::before {
          content: '';
          position: absolute;
          top: -60px; right: -60px;
          width: 350px; height: 350px;
          background: var(--yellow);
          border-radius: 50%;
          opacity: 0.08;
        }

        .hero-section::after {
          content: '';
          position: absolute;
          bottom: -80px; left: -80px;
          width: 280px; height: 280px;
          background: var(--yellow);
          border-radius: 50%;
          opacity: 0.06;
        }

        .hero-badge {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          background: var(--yellow);
          color: var(--navy);
          padding: 8px 20px;
          border-radius: 50px;
          font-weight: 700;
          font-family: 'Baloo 2', cursive;
          font-size: 14px;
          margin-bottom: 20px;
        }

        .hero-badge img {
          width: 28px; height: 28px;
          border-radius: 50%;
          object-fit: cover;
        }

        .hero-title {
          font-size: clamp(2.2rem, 5vw, 3.8rem);
          font-weight: 800;
          line-height: 1.1;
          margin-bottom: 20px;
          color: white;
        }

        .hero-title span {
          color: var(--yellow);
        }

        .hero-desc {
          font-size: 1.1rem;
          color: rgba(255,255,255,0.8);
          max-width: 600px;
          line-height: 1.7;
        }

        .back-link {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          color: var(--yellow);
          text-decoration: none;
          font-weight: 600;
          margin-bottom: 30px;
          font-size: 15px;
          transition: gap 0.3s;
        }

        .back-link:hover { gap: 10px; }

        /* Emergency Banner */
        .emergency-banner {
          background: var(--yellow);
          padding: 18px 0;
        }

        .emergency-banner .content {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          justify-content: center;
          gap: 16px;
          text-align: center;
        }

        .emergency-banner img {
          width: 36px; height: 36px;
          animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
          0%, 100% { transform: scale(1); }
          50% { transform: scale(1.15); }
        }

        .emergency-banner .label {
          font-family: 'Baloo 2', cursive;
          font-weight: 700;
          color: var(--navy);
          font-size: 1rem;
        }

        .emergency-banner a {
          font-family: 'Baloo 2', cursive;
          font-size: 1.8rem;
          font-weight: 800;
          color: var(--navy);
          text-decoration: none;
          transition: color 0.2s;
        }

        .emergency-banner a:hover { color: var(--navy-light); }

        .emergency-banner .timing {
          color: var(--navy);
          font-weight: 600;
          font-size: 0.95rem;
        }

        /* Container */
        .container {
          max-width: 1200px;
          margin: 0 auto;
          padding: 0 20px;
        }

        /* Section common */
        .section-label {
          display: inline-block;
          background: var(--yellow);
          color: var(--navy);
          font-family: 'Baloo 2', cursive;
          font-size: 12px;
          font-weight: 700;
          letter-spacing: 2px;
          text-transform: uppercase;
          padding: 4px 14px;
          border-radius: 4px;
          margin-bottom: 12px;
        }

        .section-title {
          font-size: clamp(1.8rem, 3.5vw, 2.8rem);
          font-weight: 800;
          color: var(--navy);
          margin-bottom: 12px;
        }

        .section-desc {
          color: #666;
          font-size: 1.05rem;
          line-height: 1.7;
        }

        /* Case Cards */
        .cases-section {
          padding: 80px 0;
          background: #f8f9ff;
        }

        .cases-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
          gap: 24px;
          margin-top: 48px;
        }

        .case-card {
          background: white;
          border-radius: 16px;
          overflow: hidden;
          box-shadow: 0 4px 20px rgba(0,43,92,0.08);
          transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.35s ease;
          cursor: pointer;
          border-bottom: 4px solid transparent;
        }

        .case-card:hover {
          transform: translateY(-10px) scale(1.02);
          box-shadow: 0 20px 50px rgba(0,43,92,0.18);
          border-bottom-color: var(--yellow);
        }

        .case-card-img {
          width: 100%;
          height: 180px;
          object-fit: cover;
          transition: transform 0.5s ease;
        }

        .case-card:hover .case-card-img {
          transform: scale(1.08);
        }

        .case-card-img-wrap {
          overflow: hidden;
          position: relative;
        }

        .case-card-img-wrap::after {
          content: '';
          position: absolute;
          inset: 0;
          background: linear-gradient(to bottom, transparent 50%, rgba(0,43,92,0.6));
          opacity: 0;
          transition: opacity 0.3s;
        }

        .case-card:hover .case-card-img-wrap::after {
          opacity: 1;
        }

        .case-card-body {
          padding: 20px;
        }

        .case-card-body h3 {
          font-size: 1.2rem;
          font-weight: 700;
          color: var(--navy);
          margin-bottom: 8px;
        }

        .case-card-body p {
          color: #666;
          font-size: 0.9rem;
          line-height: 1.6;
        }

        .case-card-tag {
          display: inline-block;
          background: var(--yellow);
          color: var(--navy);
          font-size: 11px;
          font-weight: 700;
          padding: 3px 10px;
          border-radius: 50px;
          margin-bottom: 10px;
        }

        /* Process Section */
        .process-section {
          padding: 80px 0;
          background: var(--navy);
        }

        .process-section .section-title { color: white; }
        .process-section .section-desc { color: rgba(255,255,255,0.7); }

        .process-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
          gap: 20px;
          margin-top: 48px;
        }

        .process-card {
          background: rgba(255,255,255,0.07);
          border: 1px solid rgba(255,213,0,0.2);
          border-radius: 16px;
          padding: 20px;
          text-align: center;
          transition: background 0.3s, transform 0.3s, border-color 0.3s;
          cursor: pointer;
        }

        .process-card:hover {
          background: rgba(255,213,0,0.12);
          border-color: var(--yellow);
          transform: translateY(-6px);
        }

        .process-img-wrap {
          width: 70px; height: 70px;
          border-radius: 50%;
          overflow: hidden;
          margin: 0 auto 14px;
          border: 3px solid var(--yellow);
          transition: border-width 0.3s;
        }

        .process-card:hover .process-img-wrap {
          border-width: 5px;
        }

        .process-img-wrap img {
          width: 100%; height: 100%;
          object-fit: cover;
        }

        .process-step-num {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 32px; height: 32px;
          background: var(--yellow);
          color: var(--navy);
          border-radius: 50%;
          font-weight: 800;
          font-size: 1rem;
          font-family: 'Baloo 2', cursive;
          margin-bottom: 10px;
        }

        .process-card h3 {
          font-size: 1rem;
          font-weight: 700;
          color: white;
          margin-bottom: 6px;
        }

        .process-card p {
          color: rgba(255,255,255,0.65);
          font-size: 0.82rem;
          line-height: 1.5;
          margin-bottom: 8px;
        }

        .process-time {
          color: var(--yellow);
          font-size: 0.78rem;
          font-weight: 700;
        }

        /* First Aid Section */
        .firstaid-section {
          padding: 80px 0;
          background: white;
        }

        .firstaid-grid {
          display: grid;
          lg-grid-cols: 2;
          gap: 48px;
          align-items: center;
        }

        @media (min-width: 1024px) {
          .firstaid-grid { grid-template-columns: 1fr 1fr; }
        }

        .firstaid-tips {
          display: flex;
          flex-direction: column;
          gap: 14px;
          margin-top: 24px;
        }

        .tip-card {
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 14px 16px;
          background: #f8f9ff;
          border-radius: 12px;
          border-left: 4px solid transparent;
          transition: border-color 0.3s, background 0.3s, transform 0.3s;
          cursor: pointer;
        }

        .tip-card:hover {
          border-left-color: var(--yellow);
          background: #fffbe6;
          transform: translateX(6px);
        }

        .tip-num {
          display: flex;
          align-items: center;
          justify-content: center;
          min-width: 36px; height: 36px;
          background: var(--navy);
          color: var(--yellow);
          border-radius: 50%;
          font-weight: 800;
          font-family: 'Baloo 2', cursive;
          font-size: 1rem;
        }

        .tip-img {
          width: 48px; height: 48px;
          border-radius: 50%;
          object-fit: cover;
          border: 2px solid var(--yellow);
          flex-shrink: 0;
        }

        .tip-text h4 {
          font-weight: 700;
          color: var(--navy);
          font-size: 0.95rem;
          margin-bottom: 2px;
        }

        .tip-text p {
          color: #666;
          font-size: 0.82rem;
          line-height: 1.5;
        }

        .firstaid-img-wrap {
          position: relative;
          margin-top: 30px;
        }

        @media (min-width: 1024px) {
          .firstaid-img-wrap { margin-top: 0; }
        }

        .firstaid-main-img {
          width: 100%;
          height: 480px;
          object-fit: cover;
          border-radius: 20px;
          box-shadow: 0 20px 60px rgba(0,43,92,0.2);
          transition: transform 0.4s;
        }

        .firstaid-main-img:hover {
          transform: scale(1.02);
        }

        .stat-badge {
          position: absolute;
          bottom: -24px; right: -12px;
          background: var(--yellow);
          color: var(--navy);
          border-radius: 14px;
          padding: 16px 24px;
          box-shadow: 0 8px 30px rgba(255,209,0,0.4);
        }

        .stat-badge p:first-child {
          font-family: 'Baloo 2', cursive;
          font-size: 2rem;
          font-weight: 800;
          line-height: 1;
        }

        .stat-badge p:last-child {
          font-weight: 600;
          font-size: 0.85rem;
        }

        /* Facilities */
        .facilities-section {
          padding: 80px 0;
          background: #f0f4ff;
          margin-top: 30px;
        }

        .facilities-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
          gap: 20px;
          margin-top: 48px;
        }

        .facility-card {
          background: white;
          border-radius: 16px;
          overflow: hidden;
          box-shadow: 0 4px 20px rgba(0,43,92,0.08);
          transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s;
        }

        .facility-card:hover {
          transform: translateY(-8px);
          box-shadow: 0 16px 40px rgba(0,43,92,0.15);
        }

        .facility-img-wrap {
          position: relative;
          overflow: hidden;
        }

        .facility-img {
          width: 100%;
          height: 160px;
          object-fit: cover;
          transition: transform 0.5s;
        }

        .facility-card:hover .facility-img {
          transform: scale(1.1);
        }

        .facility-overlay {
          position: absolute;
          inset: 0;
          background: linear-gradient(to top, var(--navy) 0%, transparent 60%);
          opacity: 0.7;
        }

        .facility-body {
          padding: 18px;
          border-top: 3px solid var(--yellow);
        }

        .facility-body h3 {
          font-weight: 700;
          color: var(--navy);
          font-size: 1.05rem;
          margin-bottom: 6px;
        }

        .facility-body p {
          color: #666;
          font-size: 0.85rem;
          line-height: 1.5;
        }

        /* Commitment */
        .commitment-section {
          padding: 80px 0;
          background: var(--navy);
          color: white;
        }

        .commitment-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
          gap: 24px;
          margin-top: 48px;
        }

        .commit-card {
          background: rgba(255,255,255,0.06);
          border: 1px solid rgba(255,209,0,0.2);
          border-radius: 16px;
          padding: 30px 24px;
          text-align: center;
          transition: background 0.3s, border-color 0.3s, transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
          cursor: pointer;
        }

        .commit-card:hover {
          background: rgba(255,209,0,0.1);
          border-color: var(--yellow);
          transform: translateY(-8px);
        }

        .commit-img {
          width: 64px; height: 64px;
          border-radius: 50%;
          object-fit: cover;
          margin: 0 auto 16px;
          border: 3px solid var(--yellow);
          transition: transform 0.3s;
        }

        .commit-card:hover .commit-img {
          transform: rotate(5deg) scale(1.1);
        }

        .commit-card h3 {
          font-weight: 700;
          font-size: 1.1rem;
          margin-bottom: 8px;
          color: var(--yellow);
        }

        .commit-card p {
          color: rgba(255,255,255,0.7);
          font-size: 0.88rem;
          line-height: 1.6;
        }

        /* Emergency CTA */
        .cta-section {
          padding: 80px 0;
          background: var(--yellow);
          text-align: center;
        }

        .cta-section h2 {
          color: var(--navy);
          font-size: clamp(2rem, 4vw, 3rem);
          font-weight: 800;
          margin-bottom: 12px;
        }

        .cta-section p {
          color: rgba(0,43,92,0.75);
          font-size: 1.05rem;
          max-width: 560px;
          margin: 0 auto 36px;
          line-height: 1.7;
        }

        .cta-img {
          width: 80px; height: 80px;
          border-radius: 50%;
          object-fit: cover;
          margin: 0 auto 24px;
          border: 4px solid var(--navy);
          animation: pulse 2s infinite;
        }

        .cta-btns {
          display: flex;
          flex-wrap: wrap;
          gap: 16px;
          justify-content: center;
        }

        .btn-call {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          padding: 16px 36px;
          background: var(--navy);
          color: white;
          font-family: 'Baloo 2', cursive;
          font-size: 1.2rem;
          font-weight: 700;
          border-radius: 10px;
          text-decoration: none;
          transition: background 0.25s, transform 0.25s;
        }

        .btn-call:hover {
          background: var(--navy-light);
          transform: translateY(-3px);
        }

        .btn-call img {
          width: 26px; height: 26px;
          border-radius: 50%;
          object-fit: cover;
        }

        .btn-wa {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          padding: 16px 36px;
          background: #25d366;
          color: white;
          font-family: 'Baloo 2', cursive;
          font-size: 1.2rem;
          font-weight: 700;
          border-radius: 10px;
          text-decoration: none;
          transition: background 0.25s, transform 0.25s;
        }

        .btn-wa:hover {
          background: #1da851;
          transform: translateY(-3px);
        }

        /* Divider wave */
        .wave-divider {
          overflow: hidden;
          line-height: 0;
        }

        .wave-divider svg {
          display: block;
          width: 100%;
        }

    transition: transform 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  .service-card:hover .svc-img {
    transform: scale(1.15);
  }

  /* Process step cards */
  .step-card {
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .step-card:hover {
    transform: translateY(-6px) scale(1.03);
    box-shadow: 0 14px 32px rgba(0,43,92,0.13);
  }
  .step-card .step-num {
    transition: background 0.3s ease, color 0.3s ease, transform 0.3s cubic-bezier(.34,1.56,.64,1);
  }
  .step-card:hover .step-num {
    background: #FFD100;
    color: #002B5C;
    transform: scale(1.15);
  }

  /* Stat cards */
  .stat-card {
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), box-shadow 0.3s ease;
  }
  .stat-card:hover {
    transform: translateY(-6px) scale(1.05);
    box-shadow: 0 10px 28px rgba(0,43,92,0.15);
  }
  .stat-card .stat-img {
    transition: transform 0.4s ease;
  }
  .stat-card:hover .stat-img {
    transform: scale(1.12) rotate(-3deg);
  }

  /* Camp cards */
  .camp-card {
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-left-color 0.25s ease;
    border-left: 4px solid transparent;
  }
  .camp-card:hover {
    transform: translateX(5px);
    box-shadow: 0 6px 18px rgba(0,43,92,0.1);
    border-left-color: #FFD100;
  }

  /* CTA buttons */
  .cta-btn {
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, color 0.2s ease;
  }
  .cta-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
  }

  /* Request buttons */
  .req-btn {
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  .req-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.15);
  }

  /* Checklist items */
  .check-item {
    transition: background 0.2s ease, transform 0.2s ease;
    border-radius: 10px;
    padding: 6px 8px;
  }
  .check-item:hover {
    background: #fffbe6;
    transform: translateX(4px);
  }

  /* Rabies facts list items */
  .fact-item {
    transition: background 0.2s ease, transform 0.2s ease;
    border-radius: 8px;
    padding: 5px 8px;
  }
  .fact-item:hover {
    background: #fff1f1;
    transform: translateX(4px);
  }
  .solution-item:hover {
    background: #f0fff4 !important;
  }

  /* Back link */
  .back-link {
    transition: gap 0.2s ease, opacity 0.2s ease;
  }
  .back-link:hover {
    opacity: 1;
    gap: 10px;
  }

  /* Pulse for CTA icon */
  @keyframes pulse-ring {
    0%   { box-shadow: 0 0 0 0 rgba(255,209,0,0.5); }
    70%  { box-shadow: 0 0 0 14px rgba(255,209,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,209,0,0); }
  }
  .pulse-img { animation: pulse-ring 2.2s infinite; }

  /* Fade up */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-up  { animation: fadeUp 0.7s ease both; }
  .d1 { animation-delay: 0.1s; }
  .d2 { animation-delay: 0.2s; }
  .d3 { animation-delay: 0.3s; }

        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Hind:wght@400;500;600&display=swap');

        :root {
          --yellow: #ffd100;
          --navy: #002b5c;
          --navy-light: #003d85;
          --yellow-dark: #e6bc00;
        }

        *, *::before, *::after { box-sizing: border-box; }

        .sc-page {

          min-height: 100vh;
          background: #f8f9ff;
          color: #333;
        }

        .sc-page h1, .sc-page h2, .sc-page h3, .sc-page h4 {

        }

        .sc-container {
          max-width: 1200px;
          margin: 0 auto;
          padding: 0 20px;
        }

        /* ── Hero ── */
        .sc-hero {
          background: var(--navy);
          color: white;
          padding: 80px 0 60px;
          position: relative;
          overflow: hidden;
        }

        .sc-hero::before {
          content: '';
          position: absolute;
          top: -80px; right: -80px;
          width: 420px; height: 420px;
          background: var(--yellow);
          border-radius: 50%;
          opacity: 0.07;
        }

        .sc-hero::after {
          content: '';
          position: absolute;
          bottom: -100px; left: -80px;
          width: 300px; height: 300px;
          background: var(--yellow);
          border-radius: 50%;
          opacity: 0.05;
        }

        .sc-hero-inner {
          position: relative;
          z-index: 1;
          display: grid;
          gap: 48px;
          align-items: center;
        }

        @media (min-width: 1024px) {
          .sc-hero-inner { grid-template-columns: 1fr 1fr; }
        }

        .sc-badge {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          background: var(--yellow);
          color: var(--navy);
          padding: 8px 20px;
          border-radius: 50px;
          font-weight: 700;
          font-family: 'Baloo 2', cursive;
          font-size: 14px;
          margin-bottom: 20px;
        }

        .sc-badge img {
          width: 28px; height: 28px;
          border-radius: 50%; object-fit: cover;
        }

        .sc-hero-title {
          font-size: clamp(2.2rem, 5vw, 3.8rem);
          font-weight: 800;
          line-height: 1.1;
          margin-bottom: 20px;
        }

        .sc-hero-title span { color: var(--yellow); }

        .sc-hero-desc {
          font-size: 1.05rem;
          color: rgba(255,255,255,0.8);
          line-height: 1.7;
          margin-bottom: 28px;
        }

        .sc-hero-btns {
          display: flex;
          flex-wrap: wrap;
          gap: 14px;
        }

        .sc-btn-primary {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 14px 28px;
          background: var(--yellow);
          color: var(--navy);
          font-family: 'Baloo 2', cursive;
          font-weight: 700;
          font-size: 1rem;
          border-radius: 50px;
          text-decoration: none;
          transition: background 0.25s, transform 0.3s;
        }

        .sc-btn-primary:hover { background: var(--yellow-dark); transform: translateY(-4px); }

        .sc-btn-secondary {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 14px 28px;
          background: rgba(255,255,255,0.12);
          color: white;
          font-family: 'Baloo 2', cursive;
          font-weight: 700;
          font-size: 1rem;
          border-radius: 50px;
          text-decoration: none;
          border: 2px solid rgba(255,255,255,0.3);
          transition: background 0.25s, transform 0.3s;
        }

        .sc-btn-secondary:hover { background: rgba(255,255,255,0.25); transform: translateY(-4px); }

        .sc-btn-primary img, .sc-btn-secondary img {
          width: 24px; height: 24px;
          border-radius: 50%; object-fit: cover;
        }

        /* Hero side visual */
        .sc-hero-visual {
          display: none;
        }

        @media (min-width: 1024px) { .sc-hero-visual { display: block; } }

        .sc-hero-img-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 12px;
        }

        .sc-hero-img-grid img {
          width: 100%; height: 160px;
          object-fit: cover;
          border-radius: 16px;
          transition: transform 0.4s;
        }

        .sc-hero-img-grid img:hover { transform: scale(1.05); }

        .sc-hero-img-grid img:first-child {
          grid-column: 1 / -1;
          height: 200px;
        }

        /* ── Stats ── */
        .sc-stats {
          background: white;
          padding: 40px 0;
          border-bottom: 3px solid var(--yellow);

          transition: background 0.3s, transform 0.35s cubic-bezier(0.34,1.56,0.64,1);

          font-size: 2.2rem;
          font-weight: 800;
          color: var(--navy);
          line-height: 1;
        }

        .sc-stat .lbl {
          color: #666;
          font-size: 0.88rem;
          margin-top: 4px;
        }

          background: var(--yellow);
          padding: 18px 0;

          gap: 14px;
          text-align: center;

        .sc-notice img {
          width: 40px; height: 40px;
          border-radius: 50%;
          object-fit: cover;
          border: 2px solid var(--navy);
        }

        .sc-notice h3 {
          font-family: 'Baloo 2', cursive;
          font-weight: 700;
          color: var(--navy);
          font-size: 1rem;
          margin-bottom: 2px;
        }

        .sc-notice p {
          color: rgba(0,43,92,0.8);
          font-size: 0.9rem;
        }

        /* ── Section Label ── */
        .sc-label {
          display: inline-block;
          background: var(--yellow);
          color: var(--navy);
          font-family: 'Baloo 2', cursive;
          font-size: 12px;
          font-weight: 700;

          border-radius: 4px;
          margin-bottom: 12px;

        .sc-section-title {
          font-size: clamp(1.8rem, 3.5vw, 2.6rem);
          font-weight: 800;
          color: var(--navy);
          margin-bottom: 12px;
        }

        .sc-section-desc {
          color: #666;
          font-size: 1rem;
          line-height: 1.7;
        }

        /* ── Tabs ── */
        .sc-tabs-section {
          padding: 80px 0;
          background: #f8f9ff;
        }

        .sc-tab-nav {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 12px;
          margin-bottom: 48px;
        }

        .sc-tab-btn {
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 12px 24px;
          border-radius: 50px;
          font-family: 'Baloo 2', cursive;
          font-weight: 600;
          font-size: 0.95rem;
          border: 2px solid transparent;
          cursor: pointer;
          transition: background 0.25s, color 0.25s, transform 0.3s, border-color 0.25s;
          background: white;
          color: #555;
        }

        .sc-tab-btn img {
          width: 28px; height: 28px;
          border-radius: 50%;
          object-fit: cover;
          border: 2px solid transparent;
          transition: border-color 0.25s;
        }

        .sc-tab-btn.active {
          background: var(--navy);
          color: white;
          border-color: var(--navy);
        }

        .sc-tab-btn.active img { border-color: var(--yellow); }

        .sc-tab-btn:not(.active):hover {
          border-color: var(--yellow);
          color: var(--navy);
          transform: translateY(-3px);
        }

        /* Features grid */
        .sc-feat-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
          gap: 22px;
        }

        .sc-feat-card {
          background: white;
          border-radius: 16px;
          overflow: hidden;
          box-shadow: 0 4px 20px rgba(0,43,92,0.08);
          transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s, border-color 0.3s;
          border-bottom: 4px solid transparent;
          cursor: pointer;
        }

        .sc-feat-card:hover {
          transform: translateY(-10px) scale(1.02);
          box-shadow: 0 22px 50px rgba(0,43,92,0.16);

          color: var(--navy);
          margin-bottom: 6px;
        }

        .sc-feat-body p { color: #666; font-size: 0.88rem; line-height: 1.6; }

        /* Category cards */
        .sc-cat-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
          gap: 20px;
        }

        .sc-cat-card {
          background: white;
          border-radius: 16px;
          overflow: hidden;
          box-shadow: 0 4px 16px rgba(0,43,92,0.08);
          transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s, border-color 0.3s;
          border-top: 4px solid transparent;
          cursor: pointer;
        }

        .sc-cat-card:hover {
          transform: translateY(-8px);
          box-shadow: 0 18px 44px rgba(0,43,92,0.15);
          border-top-color: var(--yellow);
        }

        .sc-cat-img-wrap { overflow: hidden; position: relative; height: 160px; }

        .sc-cat-img {
          width: 100%; height: 100%;
          object-fit: cover;
          transition: transform 0.5s;
        }

        .sc-cat-card:hover .sc-cat-img { transform: scale(1.08); }

        .sc-cat-emoji {
          position: absolute;
          top: 12px; left: 12px;
          font-size: 1.6rem;
          background: var(--yellow);
          padding: 4px 10px;
          border-radius: 8px;

        .sc-cat-body { padding: 18px; }

        .sc-cat-body h3 {

          color: var(--navy);
          font-size: 1.05rem;
          margin-bottom: 6px;
        }

        .sc-cat-body p { color: #666; font-size: 0.85rem; line-height: 1.5; margin-bottom: 10px; }

        .sc-cat-duration {

          align-items: center;
          gap: 6px;
          background: var(--yellow);
          color: var(--navy);
          font-size: 0.78rem;
          font-weight: 700;
          padding: 4px 12px;
          border-radius: 50px;
          font-family: 'Baloo 2', cursive;
        }

        /* Routine timeline */
        .sc-timeline {
          max-width: 680px;
          margin: 0 auto;
          position: relative;
        }

        .sc-timeline::before {
          content: '';
          position: absolute;
          left: 30px; top: 0; bottom: 0;
          width: 3px;
          background: linear-gradient(to bottom, var(--yellow), var(--navy));
          border-radius: 2px;
        }

        .sc-routine-row {
          display: flex;
          align-items: center;
          gap: 18px;
          margin-bottom: 18px;

          padding: 12px 14px;
          border-radius: 12px;

          transition: transform 0.3s;
          background: white;
        }

        .sc-routine-row:hover .sc-routine-img { transform: rotate(6deg) scale(1.08); }

        .sc-routine-time {
          font-family: 'Baloo 2', cursive;
          font-weight: 700;
          font-size: 0.85rem;

          color: #444;
          font-size: 0.92rem;
          line-height: 1.4;
        }

        .sc-process-section {
          padding: 80px 0;
          background: white;
        }

        .sc-process-grid {

          grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));

          position: relative;
        }

        .sc-process-card {
          background: #f8f9ff;
          border-radius: 16px;
          overflow: hidden;
          text-align: center;
          transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s, background 0.3s;
          border: 2px solid transparent;
          cursor: pointer;
        }

        .sc-process-card:hover {
          transform: translateY(-8px);
          box-shadow: 0 16px 40px rgba(0,43,92,0.14);
          background: white;
          border-color: var(--yellow);
        }

        .sc-process-img-wrap { overflow: hidden; height: 120px; }

        .sc-process-img {
          width: 100%; height: 100%;
          object-fit: cover;
          transition: transform 0.5s;
        }

        .sc-process-card:hover .sc-process-img { transform: scale(1.1); }

        .sc-process-body { padding: 16px; }

        .sc-process-num {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 34px; height: 34px;
          background: var(--navy);
          color: var(--yellow);
          border-radius: 50%;
          font-family: 'Baloo 2', cursive;
          font-weight: 800;
          font-size: 1rem;
          margin-bottom: 8px;
        }

        .sc-process-body h3 {
          font-weight: 700;
          color: var(--navy);
          font-size: 0.95rem;
          margin-bottom: 4px;
        }

        .sc-process-body p { color: #666; font-size: 0.8rem; line-height: 1.4; }

        /* ── Gallery ── */
        .sc-gallery-section {
          padding: 80px 0;
          background: #f8f9ff;
        }

        .sc-gallery-grid {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 16px;
          margin-top: 48px;
        }

        @media (min-width: 768px) {
          .sc-gallery-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .sc-gallery-item {
          position: relative;
          border-radius: 14px;
          overflow: hidden;
          aspect-ratio: 16/10;
          cursor: pointer;
        }

        .sc-gallery-item img {
          width: 100%; height: 100%;
          object-fit: cover;
          transition: transform 0.5s;
        }

        .sc-gallery-item:hover img { transform: scale(1.1); }

        .sc-gallery-overlay {
          position: absolute; inset: 0;
          background: linear-gradient(to top, rgba(0,43,92,0.8) 0%, transparent 55%);
          opacity: 0.7;
          transition: opacity 0.3s;
        }

        .sc-gallery-item:hover .sc-gallery-overlay { opacity: 1; }

        .sc-gallery-info {
          position: absolute;
          bottom: 14px; left: 14px;
          color: white;
        }

        .sc-gallery-info .cat {
          font-size: 11px;
          color: var(--yellow);
          font-weight: 700;
          letter-spacing: 1px;
          text-transform: uppercase;
        }

        .sc-gallery-info .title {
          font-family: 'Baloo 2', cursive;
          font-weight: 700;
          font-size: 1rem;
        }

        /* ── Support ── */
        .sc-support-section {
          padding: 80px 0;
          background: var(--navy);
          color: white;
        }

        .sc-support-grid {
          display: grid;
          gap: 48px;
          align-items: start;
        }

        @media (min-width: 1024px) {
          .sc-support-grid { grid-template-columns: 1fr 1fr; }
        }

        .sc-support-section .sc-section-title { color: var(--yellow); }
        .sc-support-section .sc-section-desc { color: rgba(255,255,255,0.75); }

        .sc-donation-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 14px;
          margin: 24px 0 32px;
        }

        .sc-donation-card {
          background: rgba(255,255,255,0.08);
          border: 1px solid rgba(255,209,0,0.2);
          border-radius: 12px;
          padding: 16px;
          transition: background 0.3s, border-color 0.3s, transform 0.3s;
          cursor: pointer;
        }

        .sc-donation-card:hover {
          background: rgba(255,209,0,0.12);
          border-color: var(--yellow);
          transform: translateY(-4px);
        }

        .sc-donation-card .amt {
          font-family: 'Baloo 2', cursive;
          font-size: 1.6rem;
          font-weight: 800;
          color: var(--yellow);
        }

        .sc-donation-card .desc { color: rgba(255,255,255,0.7); font-size: 0.82rem; }

        .sc-donate-btn {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          padding: 14px 32px;
          background: var(--yellow);
          color: var(--navy);
          font-family: 'Baloo 2', cursive;
          font-weight: 700;
          font-size: 1.05rem;
          border-radius: 50px;
          text-decoration: none;
          transition: background 0.25s, transform 0.3s;
        }

        .sc-donate-btn:hover { background: var(--yellow-dark); transform: translateY(-4px); }

        .sc-donate-btn img {
          width: 26px; height: 26px;
          border-radius: 50%; object-fit: cover;
        }

        .sc-other-help {
          background: rgba(255,255,255,0.06);
          border: 1px solid rgba(255,209,0,0.2);
          border-radius: 20px;
          padding: 30px;
        }

        .sc-other-help h3 {
          color: white;
          font-size: 1.2rem;
          margin-bottom: 20px;
        }

        .sc-help-row {
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 12px;
          border-radius: 10px;
          margin-bottom: 12px;
          border-left: 3px solid transparent;
          transition: background 0.25s, border-color 0.25s, transform 0.25s;
          cursor: pointer;
        }

        .sc-help-row:hover {
          background: rgba(255,209,0,0.1);
          border-left-color: var(--yellow);
          transform: translateX(6px);
        }

        .sc-help-row img {
          width: 46px; height: 46px;
          border-radius: 50%;
          object-fit: cover;
          border: 2px solid var(--yellow);
          flex-shrink: 0;
          transition: transform 0.3s;
        }

        .sc-help-row:hover img { transform: scale(1.1) rotate(-5deg); }

        .sc-help-row h4 { color: var(--yellow); font-size: 0.92rem; font-weight: 700; margin-bottom: 2px; }
        .sc-help-row p { color: rgba(255,255,255,0.65); font-size: 0.82rem; }

        /* ── Visit ── */
        .sc-visit-section {
          padding: 80px 0;
          background: white;
        }

        .sc-visit-card {
          background: #f8f9ff;
          border-radius: 24px;
          padding: 40px;
          max-width: 960px;
          margin: 0 auto;
        }

        .sc-visit-inner {
          display: grid;
          gap: 40px;
          align-items: start;
        }

        @media (min-width: 1024px) {
          .sc-visit-inner { grid-template-columns: 1fr 1fr; }
        }

        .sc-visit-row {
          display: flex;
          align-items: flex-start;
          gap: 14px;
          padding: 12px;
          border-radius: 10px;
          margin-bottom: 14px;
          transition: background 0.25s, transform 0.25s;
          cursor: pointer;
        }

        .sc-visit-row:hover {
          background: #fffbe6;
          transform: translateX(6px);
        }

        .sc-visit-row img {
          width: 44px; height: 44px;
          border-radius: 50%;
          object-fit: cover;
          border: 2px solid var(--yellow);
          flex-shrink: 0;
          transition: transform 0.3s;
        }

        .sc-visit-row:hover img { transform: scale(1.1) rotate(5deg); }

        .sc-visit-row h4 { font-weight: 700; color: var(--navy); font-size: 0.92rem; margin-bottom: 3px; }
        .sc-visit-row p { color: #666; font-size: 0.85rem; line-height: 1.5; }

        .sc-visit-img-wrap {
          border-radius: 16px;
          overflow: hidden;
          height: 300px;
        }

        .sc-visit-img-wrap img {
          width: 100%; height: 100%;
          object-fit: cover;
          transition: transform 0.5s;
        }

        .sc-visit-img-wrap:hover img { transform: scale(1.05); }

        /* ── FAQ ── */
        .sc-faq-section {
          padding: 80px 0;
          background: #f8f9ff;
        }

        .sc-faq-list {
          max-width: 760px;
          margin: 48px auto 0;
        }

        .sc-faq-item {
          background: white;
          border-radius: 14px;
          margin-bottom: 14px;
          overflow: hidden;
          box-shadow: 0 2px 12px rgba(0,43,92,0.07);
          border-left: 4px solid transparent;
          transition: border-color 0.3s;
        }

        .sc-faq-item.open { border-left-color: var(--yellow); }

        .sc-faq-q {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 18px 20px;
          cursor: pointer;
          gap: 12px;
        }

        .sc-faq-q h3 {
          font-weight: 700;
          color: var(--navy);
          font-size: 0.95rem;
          line-height: 1.4;
          margin: 0;
        }

        .sc-faq-arrow {
          width: 30px; height: 30px;
          min-width: 30px;
          background: var(--yellow);
          color: var(--navy);
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 800;
          font-size: 1.1rem;
          transition: transform 0.3s;
        }

        .sc-faq-item.open .sc-faq-arrow { transform: rotate(45deg); }

        .sc-faq-a {
          padding: 0 20px;
          max-height: 0;
          overflow: hidden;
          transition: max-height 0.4s ease, padding 0.3s;
          color: #555;
          font-size: 0.9rem;
          line-height: 1.6;
        }

        .sc-faq-item.open .sc-faq-a {
          max-height: 200px;
          padding: 0 20px 18px;
        }

        /* ── CTA ── */
        .sc-cta-section {
          padding: 80px 0;
          background: var(--yellow);
          text-align: center;
        }

        .sc-cta-img {
          width: 80px; height: 80px;
          border-radius: 50%;
          object-fit: cover;
          margin: 0 auto 24px;
          border: 4px solid var(--navy);
          display: block;
          animation: sc-pulse 2s infinite;
        }

        @keyframes sc-pulse {
          0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0,43,92,0.3); }
          50% { transform: scale(1.08); box-shadow: 0 0 0 12px rgba(0,43,92,0); }
        }

        .sc-cta-section h2 {
          font-size: clamp(1.8rem, 4vw, 2.8rem);
          font-weight: 800;
          color: var(--navy);
          margin-bottom: 14px;
        }

        .sc-cta-section p {
          color: rgba(0,43,92,0.75);
          font-size: 1.05rem;
          max-width: 560px;
          margin: 0 auto 36px;
          line-height: 1.7;
        }

        .sc-cta-btns {
          display: flex;
          flex-wrap: wrap;
          gap: 16px;
          justify-content: center;
        }

        .sc-cta-btn-dark {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          padding: 16px 36px;
          background: var(--navy);
          color: white;
          font-family: 'Baloo 2', cursive;
          font-size: 1.1rem;
          font-weight: 700;
          border-radius: 50px;
          text-decoration: none;
          transition: background 0.25s, transform 0.3s;
        }

        .sc-cta-btn-dark:hover { background: var(--navy-light); transform: translateY(-4px); }

        .sc-cta-btn-white {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          padding: 16px 36px;
          background: white;
          color: var(--navy);
          font-family: 'Baloo 2', cursive;
          font-size: 1.1rem;
          font-weight: 700;
          border-radius: 50px;
          text-decoration: none;
          border: 2px solid var(--navy);
          transition: background 0.25s, transform 0.3s;
        }

        .sc-cta-btn-white:hover { background: var(--navy); color: white; transform: translateY(-4px); }

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap');

        /* ── Reveal ── */
        .rev     { opacity:0; transform:translateY(36px); transition:opacity 0.85s cubic-bezier(0.16,1,0.3,1), transform 0.85s cubic-bezier(0.16,1,0.3,1); }
        .rev.in  { opacity:1; transform:translateY(0); }
        .rev-l   { opacity:0; transform:translateX(-44px); transition:opacity 0.85s ease, transform 0.85s ease; }
        .rev-l.in{ opacity:1; transform:translateX(0); }
        .rev-r   { opacity:0; transform:translateX(44px);  transition:opacity 0.85s ease, transform 0.85s ease; }
        .rev-r.in{ opacity:1; transform:translateX(0); }

        /* stagger children */
        .stag > * { opacity:0; transform:translateY(20px); transition:opacity 0.55s ease, transform 0.55s ease; }
        .stag.in > *:nth-child(1){opacity:1;transform:none;transition-delay:0ms}
        .stag.in > *:nth-child(2){opacity:1;transform:none;transition-delay:80ms}
        .stag.in > *:nth-child(3){opacity:1;transform:none;transition-delay:160ms}
        .stag.in > *:nth-child(4){opacity:1;transform:none;transition-delay:240ms}
        .stag.in > *:nth-child(5){opacity:1;transform:none;transition-delay:320ms}
        .stag.in > *:nth-child(6){opacity:1;transform:none;transition-delay:400ms}

        /* ── Hero paws ── */
        @keyframes floatpaw{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-16px) rotate(8deg)}}
        .paw-float{animation:floatpaw 5s ease-in-out infinite;}

        /* ── Dot bg ── */
        .dot-bg{background-image:radial-gradient(circle,rgba(0,43,92,0.07) 1px,transparent 1px);background-size:26px 26px;}

        /* ── Value cards ── */
        .value-card{transition:transform 0.45s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.45s ease, border-color 0.3s ease;}
        .value-card:hover{transform:translateY(-10px);box-shadow:0 28px 56px rgba(0,43,92,0.13);border-color:var(--ac,#ffd100);}
        .vc-bg{position:absolute;inset:0;opacity:0;transition:opacity 0.4s ease;border-radius:inherit;}
        .value-card:hover .vc-bg{opacity:0.055;}
        .vc-icon{transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);}
        .value-card:hover .vc-icon{transform:scale(1.12) rotate(-6deg);}

        /* ── Principle cards ── */
        .principle-card{transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.4s ease, border-color 0.3s ease;}
        .principle-card:hover{transform:translateY(-8px);box-shadow:0 24px 50px rgba(0,43,92,0.12);border-color:#ffd100;}
        .pc-bar{position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#ffd100,#f97316);transform:scaleX(0);transform-origin:left;transition:transform 0.5s ease;border-radius:3px 3px 0 0;}
        .principle-card:hover .pc-bar{transform:scaleX(1);}

        /* ── Goal cards ── */
        .goal-card{transition:transform 0.45s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.45s ease;}
        .goal-card:hover{transform:translateY(-10px);box-shadow:0 32px 64px rgba(0,43,92,0.25);}

        /* ── Mission / Vision boxes ── */
        .mv-box{transition:transform 0.45s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.45s ease;}
        .mv-box:hover{transform:translateY(-8px) scale(1.01);box-shadow:0 30px 60px rgba(0,0,0,0.14);}

        /* ── Check list rows ── */
        .check-row{display:flex;align-items:flex-start;gap:16px;padding:14px 16px;border-radius:16px;transition:background 0.3s ease, transform 0.3s ease;}
        .check-row:hover{background:rgba(0,43,92,0.04);transform:translateX(6px);}

        /* ── Commitment cards ── */
        .commit-card{transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.4s ease;}
        .commit-card:hover{transform:translateY(-8px);box-shadow:0 24px 50px rgba(0,43,92,0.14);}
        .commit-icon{transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1), background 0.3s ease;}
        .commit-card:hover .commit-icon{transform:scale(1.15) rotate(-6deg);}

        /* ── Stat box ── */
        .stat-box{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(10px);border-radius:24px;padding:28px;transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.4s ease, border-color 0.3s ease;position:relative;overflow:hidden;}
        .stat-box:hover{transform:translateY(-8px) scale(1.03);box-shadow:0 24px 50px rgba(255,209,0,0.2);border-color:rgba(255,209,0,0.45);}
        .stat-shine{position:absolute;top:-50%;left:-60%;width:40%;height:200%;background:linear-gradient(105deg,transparent,rgba(255,255,255,0.09),transparent);transform:skewX(-15deg);transition:left 0.8s ease;pointer-events:none;}
        .stat-box:hover .stat-shine{left:130%;}

        /* ── CTA buttons ── */
        .btn-gold{position:relative;overflow:hidden;background:#ffd100;color:#002b5c;transition:transform 0.25s ease, box-shadow 0.25s ease;}
        .btn-gold::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,0.25) 50%,transparent 60%);background-size:200% 100%;background-position:200% 0;transition:background-position 0.5s ease;}
        .btn-gold:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(255,209,0,0.4);}
        .btn-gold:hover::after{background-position:-200% 0;}
        .btn-white{transition:all 0.3s ease;}
        .btn-white:hover{background:#002b5c;color:white;transform:translateY(-3px);box-shadow:0 14px 36px rgba(0,43,92,0.3);}

        /* ── Globe card ── */
        .globe-card{transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);}
        .globe-card:hover{transform:translateY(-8px);}

        /* ── Section label pill ── */
